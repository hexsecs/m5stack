; Toddler Toolkit for M5StickC Plus / Plus2.
; M5Unified auto-detects which StickC model it is running on, so a single
; firmware build works for both.

[platformio]
default_envs = m5stickc-plus

[common]
lib_deps =
    m5stack/M5Unified@^0.2.5

; The real device: `pio run -t upload`
[env:m5stickc-plus]
platform = espressif32@^6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps = ${common.lib_deps}

; Desktop simulator (needs SDL2: `brew install sdl2` / `apt install libsdl2-dev`).
; Run with `pio run -e native_sim -t exec`.
; Keys: Left = big button A, Down = side button B, Up = power button.
[env:native_sim]
platform = native
build_flags = -O1 -std=c++17 -lSDL2
    -DM5GFX_BOARD=board_M5StickCPlus
    -DM5GFX_SCALE=2
    -DM5GFX_ROTATION=0
    -I"/usr/local/include/SDL2"
    -L"/usr/local/lib"
    -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
    -L"${sysenv.HOMEBREW_PREFIX}/lib"
lib_deps = ${common.lib_deps}

; Host-side unit tests for the hardware-independent logic in lib/:
; `pio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
